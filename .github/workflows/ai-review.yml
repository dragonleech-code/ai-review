name: AI review

# Reusable AI first-pass code review for every repo in the org. Callers pass a
# PR number; this workflow fetches that PR's diff through the GitHub API, sends
# it to an OpenAI-compatible model, and posts the findings as inline review
# comments plus one overview comment.
#
# A caller is ~20 lines — see README.md. Configure the key and optional
# provider settings as organization secrets and variables:
#   secret   AI_REVIEW_API_KEY    (OPENROUTER_API_KEY is accepted as a fallback)
#   variable AI_REVIEW_BASE_URL   API base URL (default https://openrouter.ai/api/v1)
#   variable AI_REVIEW_EFFORT     minimal|low|medium|high|none (default medium)
#
# The PR's code is never checked out or executed: it is read as a diff.

on:
  workflow_call:
    inputs:
      pr_number:
        description: PR number to review, in the calling repository
        required: true
        type: string
      model:
        description: Model ID override (blank = choose by filtered diff size)
        required: false
        type: string
      effort:
        description: Reasoning effort override (blank = AI_REVIEW_EFFORT)
        required: false
        type: string
      context_file:
        description: Repo conventions sent with the diff, skipped when absent
        required: false
        type: string
        default: CLAUDE.md
      max_diff_bytes:
        description: Optional diff size limit in bytes (blank = AI_REVIEW_MAX_DIFF_BYTES, else no limit)
        required: false
        type: string
    secrets:
      AI_REVIEW_API_KEY:
        description: API key for the review model provider
        required: false
      OPENROUTER_API_KEY:
        description: Legacy fallback for AI_REVIEW_API_KEY
        required: false
      AI_REVIEW_MEMBERS_TOKEN:
        description: Token with Members read access to the calling repository's organization, required for private-member automatic reviews and manual reviews
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Event payload fields can differ from REST responses. Fetch eligibility
      # explicitly and explain exclusions before checkouts or model requests.
      - name: Check review eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          MEMBERS_TOKEN: ${{ secrets.AI_REVIEW_MEMBERS_TOKEN }}
        run: |
          set -euo pipefail
          owner_type=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .owner.type)
          if [ "$owner_type" != "Organization" ]; then
            echo "::error::AI review requires an organization-owned repository (got ${owner_type})"
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Manual review: organization membership will be verified next"
            exit 0
          fi
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          association=$(jq -r '.author_association' <<< "$pr")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<< "$pr")
          draft=$(jq -r '.draft' <<< "$pr")
          echo "Review eligibility: owner=${owner_type}, association=${association}, head=${head_repo}, draft=${draft}, actor=${ACTOR}"
          reason=""
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            reason="fork PRs require an organization-member manual review"
          elif [ "$draft" != "false" ]; then
            reason="draft PRs are not reviewed automatically"
          elif [ "$ACTOR" = 'dependabot[bot]' ]; then
            reason="Dependabot reviews are excluded"
          elif [ "$association" != "MEMBER" ] && [ "$association" != "OWNER" ]; then
            # GITHUB_TOKEN may see a private member as CONTRIBUTOR. Verify
            # that author's membership with the dedicated read-only token.
            if [ -z "$MEMBERS_TOKEN" ]; then
              echo "::error::PR author association is ${association}; set AI_REVIEW_MEMBERS_TOKEN with organization Members read access to verify private membership"
              exit 1
            fi
            author=$(jq -r '.user.login' <<< "$pr")
            org="${GITHUB_REPOSITORY%%/*}"
            if ! state=$(GH_TOKEN="$MEMBERS_TOKEN" gh api "orgs/${org}/memberships/${author}" --jq .state); then
              echo "::error::Cannot verify ${author}'s organization membership; no review will run"
              exit 1
            fi
            if [ "$state" != "active" ]; then
              reason="PR author does not have active organization membership"
            fi
          fi
          if [ -n "$reason" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AI review skipped: ${reason}"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi
      # Dispatch may target any author's PR, but the person starting it must
      # belong to the repository's owning organization. Check reruns too so
      # an outside collaborator cannot reuse an authorized member's run.
      - name: Require an organization member
        if: steps.eligibility.outputs.eligible == 'true' && (github.event_name == 'workflow_dispatch' || github.run_attempt > 1)
        env:
          GH_TOKEN: ${{ secrets.AI_REVIEW_MEMBERS_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          WHO: ${{ github.triggering_actor }}
        run: |
          owner_type=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}" --jq .owner.type)
          if [ "$owner_type" != "Organization" ]; then
            echo "::error::AI review requires an organization-owned repository"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set AI_REVIEW_MEMBERS_TOKEN with organization Members read access to verify membership"
            exit 1
          fi
          org="${GITHUB_REPOSITORY%%/*}"
          if ! state=$(gh api "orgs/${org}/memberships/${WHO}" --jq .state); then
            echo "::error::Cannot verify ${WHO}'s membership in ${org}; no review will run"
            exit 1
          fi
          if [ "$state" != "active" ]; then
            echo "::error::AI review requires active membership in ${org}; ${WHO} is not an active member"
            exit 1
          fi

      # The reviewer script from THIS repo. The ref is pinned to the tag
      # callers use, so bumping the tag moves the workflow and its script
      # together — update it in the same commit that cuts a new major tag.
      - name: Check out the reviewer
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dragonleech-code/ai-review
          ref: v1
          sparse-checkout: .github/scripts/ai-review.sh
          sparse-checkout-cone-mode: false
          path: reviewer
          persist-credentials: false

      # The caller's conventions file only, taken from the PR's BASE commit so
      # a pull request cannot rewrite the instructions sent with its own diff.
      # A repo without the file checks out nothing and the script skips it.
      - name: Check out the caller's conventions
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          sparse-checkout: ${{ inputs.context_file }}
          sparse-checkout-cone-mode: false
          path: caller
          persist-credentials: false

      - name: Review
        if: steps.eligibility.outputs.eligible == 'true'
        run: ./reviewer/.github/scripts/ai-review.sh
        env:
          # OPENROUTER_API_KEY is the older name, kept as a fallback.
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY || secrets.OPENROUTER_API_KEY }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          AI_REVIEW_MODEL: ${{ inputs.model }}
          AI_REVIEW_EFFORT: ${{ inputs.effort || vars.AI_REVIEW_EFFORT }}
          CONTEXT_FILE: caller/${{ inputs.context_file }}
          MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes || vars.AI_REVIEW_MAX_DIFF_BYTES }}
