name: AI review

# Reusable AI first-pass code review for every repo in the org. Callers pass a
# PR number; this workflow fetches that PR's diff through the GitHub API, sends
# it to an OpenAI-compatible model, and posts the findings as inline review
# comments plus one overview comment.
#
# A caller is ~20 lines — see README.md. Configure the model and key once, as
# organization secrets and variables:
#   secret   AI_REVIEW_API_KEY    (OPENROUTER_API_KEY is accepted as a fallback)
#   variable AI_REVIEW_BASE_URL   API base URL (default https://openrouter.ai/api/v1)
#   variable AI_REVIEW_MODEL      model ID as that provider names it
#   variable AI_REVIEW_EFFORT     minimal|low|medium|high|none (default low)
#
# The PR's code is never checked out or executed: it is read as a diff.

on:
  workflow_call:
    inputs:
      pr_number:
        description: PR number to review, in the calling repository
        required: true
        type: string
      model:
        description: Model ID override (blank = AI_REVIEW_MODEL)
        required: false
        type: string
      effort:
        description: Reasoning effort override (blank = AI_REVIEW_EFFORT)
        required: false
        type: string
      context_file:
        description: Repo conventions sent with the diff, skipped when absent
        required: false
        type: string
        default: CLAUDE.md

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork PRs reach a workflow without secrets, so they cannot be reviewed
    # automatically; an admin dispatches one by number instead. In a reusable
    # workflow github.repository is the CALLER's repository, which is what
    # both this check and the script's API calls want.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only for dispatch: an automatic run has no triggering person to vet.
      # Write access is enough to dispatch and re-run workflows, and every run
      # spends API credit, so require admin on the calling repository.
      - name: Require an admin
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          WHO: ${{ github.triggering_actor }}
        run: |
          perm=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${WHO}/permission" --jq .permission)
          if [ "$perm" != "admin" ]; then
            echo "::error::AI review is admin-only; ${WHO} has '${perm}' access"
            exit 1
          fi

      # The reviewer script from THIS repo. The ref is pinned to the tag
      # callers use, so bumping the tag moves the workflow and its script
      # together — update it in the same commit that cuts a new major tag.
      - name: Check out the reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dragonleech-code/ai-review
          ref: v1
          sparse-checkout: .github/scripts/ai-review.sh
          sparse-checkout-cone-mode: false
          path: reviewer
          persist-credentials: false

      # The caller's conventions file only, taken from the PR's BASE commit so
      # a pull request cannot rewrite the instructions sent with its own diff.
      # A repo without the file checks out nothing and the script skips it.
      - name: Check out the caller's conventions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          sparse-checkout: ${{ inputs.context_file }}
          sparse-checkout-cone-mode: false
          path: caller
          persist-credentials: false

      - name: Review
        run: ./reviewer/.github/scripts/ai-review.sh
        env:
          # OPENROUTER_API_KEY is the older name, kept as a fallback.
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY || secrets.OPENROUTER_API_KEY }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          AI_REVIEW_MODEL: ${{ inputs.model || vars.AI_REVIEW_MODEL }}
          AI_REVIEW_EFFORT: ${{ inputs.effort || vars.AI_REVIEW_EFFORT }}
          CONTEXT_FILE: caller/${{ inputs.context_file }}
